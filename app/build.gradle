plugins {
    id 'com.android.application'
}

android {
    namespace 'com.acimreminder.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.acimreminder.app"
        minSdk 33          // Android 13 — first version with runtime notification permission
        targetSdk 37       // Android 17
        versionCode 1
        versionName "1.0-lesson99"
    }

    buildTypes {
        debug {
            // Debug build is what CI ships. No signing config needed — Gradle
            // signs debug APKs with the auto-generated debug key.
            applicationIdSuffix ""
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

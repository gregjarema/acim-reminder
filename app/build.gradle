plugins {
    id 'com.android.application'
}

android {
    namespace 'com.acimreminder.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.acimreminder.app"
        minSdk 33          // Android 13 — first version with runtime notification permission
        targetSdk 36       // Android 16 (the newest platform published to the build tools;
                           // Android 17 / API 37 isn't downloadable yet). Runs fine on Android 17.
        versionCode 28
        versionName "3.10-wallpaper-dark-mode"
    }

    buildTypes {
        debug {
            // Debug build is what CI ships. No signing config needed — Gradle
            // signs debug APKs with the auto-generated debug key.
            applicationIdSuffix ""
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

name: Build APK

# Builds a debug APK on every push and publishes it to a GitHub Release,
# so you can download and tap-to-install it straight from your phone.

on:
  push:
    branches:
      - main
  workflow_dispatch:   # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write        # needed to create the Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android platform + build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Without this the APK is signed with a key the runner invents for this
      # build alone, so it can never install over the previous version.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/signing.jks
            echo "Signing with the stable key — this build will update in place."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set. Falling back to a"
            echo "::warning::throwaway debug key, so this build will NOT install over"
            echo "::warning::the previous one. See the README."
          fi

      - name: Build the debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Give the APK a friendly name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/acim-reminder.apk
          ls -la out

      - name: Publish the APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: A Course in Miracles (build ${{ github.run_number }})
          body: |
            Debug build of the ACIM daily reminder app — the Workbook lesson
            and the daily Text reading, in two tabs.

            **Install on your phone:** tap `acim-reminder.apk` below to
            download, then open it to install. See the README for the one-time
            "install unknown apps" and permission steps.
          make_latest: true
          files: out/acim-reminder.apk

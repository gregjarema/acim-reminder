name: Build APK

# Builds a debug APK on every push and publishes it to a GitHub Release,
# so you can download and tap-to-install it straight from your phone.

on:
  push:
    branches:
      - "claude/acim-daily-reminder-app-0s6s5z"
      - main
  workflow_dispatch:   # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write        # needed to create the Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android platform + build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build the debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Give the APK a friendly name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/acim-reminder-lesson99.apk
          ls -la out

      - name: Publish the APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lesson99-build-${{ github.run_number }}
          name: ACIM Reminder - Lesson 99 (build ${{ github.run_number }})
          body: |
            Debug build of the ACIM daily reminder app (Lesson 99).

            **Install on your phone:** tap `acim-reminder-lesson99.apk` below to
            download, then open it to install. See the README for the one-time
            "install unknown apps" and permission steps.
          make_latest: true
          files: out/acim-reminder-lesson99.apk

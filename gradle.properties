org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Android 17 (API 37) is newer than this Android Gradle Plugin was tested against.
# The app only uses long-stable APIs, so we tell AGP to build against it anyway
# instead of failing. Safe for this project.
android.suppressUnsupportedCompileSdk=37
